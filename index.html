<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💘 Cloclo 💘</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fecfef, #fad0c4, #ffecd2);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #333;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating hearts decoration */
    .hearts-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .floating-heart {
      position: absolute;
      font-size: 24px;
      animation: floatUp 6s ease-in-out infinite;
      opacity: 0.6;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      5% {
        opacity: 0;
      }
      15% {
        opacity: 0.6;
      }
      85% {
        opacity: 0.6;
      }
      95% {
        opacity: 0;
      }
      100% {
        transform: translateY(10vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Confetti styles */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      pointer-events: none;
      z-index: 1000;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    .card {
      background: linear-gradient(145deg, #ffffff, #fff5f5);
      padding: 50px 60px;
      border-radius: 30px;
      box-shadow:
        0 20px 60px rgba(255, 77, 109, 0.3),
        0 0 0 5px rgba(255, 255, 255, 0.5),
        inset 0 0 30px rgba(255, 182, 193, 0.2);
      position: relative;
      z-index: 1;
      border: 3px solid rgba(255, 182, 193, 0.5);
    }

    .card::before {
      content: '✨💖✨';
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      background: white;
      padding: 5px 15px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(255, 77, 109, 0.2);
    }

    /* Intro card styles */
    .intro-card {
      background: linear-gradient(145deg, #fff0f5, #ffe4ec);
      padding: 40px 50px;
      border-radius: 25px;
      box-shadow:
        0 15px 40px rgba(255, 77, 109, 0.25),
        0 0 0 4px rgba(255, 255, 255, 0.6),
        inset 0 0 20px rgba(255, 182, 193, 0.3);
      border: 2px dashed rgba(255, 105, 135, 0.4);
      margin-bottom: 25px;
    }

    .intro-card h2 {
      font-size: 22px;
      color: #e91e63;
      margin-bottom: 15px;
    }

    .intro-card .penguin {
      font-size: 50px;
      margin: 10px 0;
    }

    .reveal-btn {
      background: linear-gradient(135deg, #ff85a2, #ffa8bb);
      color: white;
      font-size: 16px;
      padding: 12px 30px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.3);
      margin-top: 10px;
    }

    .reveal-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 30px rgba(255, 77, 109, 0.4);
    }

    .question-card {
      display: none;
      animation: slideIn 0.5s ease forwards;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      color: #e91e63;
      text-shadow: 2px 2px 4px rgba(233, 30, 99, 0.2);
    }

    .subtitle {
      font-size: 16px;
      color: #ff6b8a;
      margin-bottom: 25px;
      font-style: italic;
    }

    .buttons-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font-size: 18px;
      padding: 15px 35px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    button:hover::after {
      width: 300px;
      height: 300px;
    }

    .yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758c);
      color: white;
      box-shadow: 0 8px 25px rgba(255, 77, 109, 0.4);
    }

    .yes:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 35px rgba(255, 77, 109, 0.5);
    }

    .no {
      background: linear-gradient(135deg, #e0e0e0, #bdbdbd);
      color: #666;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .no:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    #message {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
      min-height: 40px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sparkles {
      display: inline-block;
      animation: sparkle 1s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    .footer-deco {
      margin-top: 30px;
      font-size: 20px;
      letter-spacing: 5px;
    }

    /* Mobile responsiveness */
    @media (max-width: 600px) {
      body {
        padding: 15px;
        align-items: center;
      }

      .card {
        padding: 25px 20px;
        border-radius: 20px;
        max-width: 100%;
      }

      .card::before {
        font-size: 18px;
        top: -15px;
        padding: 4px 12px;
      }

      .intro-card {
        padding: 25px 20px;
        border-radius: 20px;
        margin-bottom: 20px;
      }

      .intro-card h2 {
        font-size: 18px;
      }

      .intro-card .penguin {
        font-size: 40px;
      }

      .reveal-btn {
        font-size: 14px;
        padding: 10px 25px;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 20px;
      }

      .subtitle {
        font-size: 14px;
      }

      .question-card p {
        font-size: 16px !important;
      }

      .buttons-container {
        gap: 15px;
        flex-direction: column;
        align-items: center;
      }

      button {
        font-size: 16px;
        padding: 12px 30px;
        width: 100%;
        max-width: 200px;
      }

      #message {
        font-size: 18px;
        margin-top: 20px;
      }

      .footer-deco {
        margin-top: 20px;
        font-size: 16px;
        letter-spacing: 3px;
      }

      .floating-heart {
        font-size: 18px;
      }
    }

    /* Very small screens */
    @media (max-width: 360px) {
      .card {
        padding: 20px 15px;
      }

      .intro-card {
        padding: 20px 15px;
      }

      h1 {
        font-size: 20px;
      }

      .intro-card h2 {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating hearts background -->
  <div class="hearts-bg" id="hearts-container"></div>

  <div class="card">
    <h1>💖 Cloclo 💖</h1>

    <!-- Intro section with separate frame -->
    <div class="intro-card" id="intro-section">
      <h2>~ J'ai une question... ~</h2>
      <div class="penguin">🐧</div>
      <p style="font-size: 14px; color: #888; margin-bottom: 10px;">Clique pour découvrir !</p>
      <button class="reveal-btn" onclick="revealQuestion()">💫 Dis-moi ! 💫</button>
    </div>

    <!-- Question section (hidden initially) -->
    <div class="question-card" id="question-section">
      <p style="font-size: 20px; margin-bottom: 25px;">🌸 Veux-tu être ma Valentine ? 🌸</p>

      <div class="buttons-container">
        <button class="yes" onclick="yesClicked()">💕 Oui 💕</button>
        <button class="no" onclick="noClicked()">Non</button>
      </div>

      <div id="message"></div>
    </div>

    <div class="footer-deco">💗🌹💗🌹💗</div>
  </div>

  <script>
    // Create floating hearts
    function createHearts() {
      const container = document.getElementById('hearts-container');
      const hearts = ['💕', '💖', '💗', '💝', '💘', '❤️', '🌸', '✨', '🦋', '🌹'];

      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('span');
        heart.className = 'floating-heart';
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDuration = (4 + Math.random() * 4) + 's';
        heart.style.animationDelay = Math.random() * 6 + 's';
        heart.style.fontSize = (16 + Math.random() * 20) + 'px';
        container.appendChild(heart);
      }
    }

    createHearts();

    // Reveal the question when button is clicked
    function revealQuestion() {
      document.getElementById('intro-section').style.display = 'none';
      document.getElementById('question-section').style.display = 'block';
    }

    // Create confetti explosion
    function createConfetti() {
      const colors = ['#ff4d6d', '#ff758c', '#ffd700', '#ff69b4', '#87ceeb', '#98fb98', '#dda0dd', '#f0e68c'];
      const shapes = ['square', 'circle'];

      for (let i = 0; i < 150; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';

          // Random color
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

          // Random shape
          if (shapes[Math.floor(Math.random() * shapes.length)] === 'circle') {
            confetti.style.borderRadius = '50%';
          }

          // Random size
          const size = Math.random() * 10 + 5;
          confetti.style.width = size + 'px';
          confetti.style.height = size + 'px';

          // Random position
          confetti.style.left = Math.random() * 100 + 'vw';

          // Random animation duration
          confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';

          document.body.appendChild(confetti);

          // Remove confetti after animation
          setTimeout(() => confetti.remove(), 4000);
        }, i * 20);
      }
    }

    function yesClicked() {
      const msg = document.getElementById("message");
      msg.innerHTML = "🥰💖 Yay ! I'm so happyyyy ! 💖🥰<br><span class='sparkles'>✨🎉💕🎉✨</span>";

      // Launch confetti!
      createConfetti();

      // Extra celebration hearts
      for (let i = 0; i < 10; i++) {
        setTimeout(() => {
          const heart = document.createElement('span');
          heart.className = 'floating-heart';
          heart.textContent = ['💖', '💕', '💗', '🎉', '✨'][Math.floor(Math.random() * 5)];
          heart.style.left = Math.random() * 100 + '%';
          heart.style.animationDuration = '3s';
          heart.style.fontSize = '30px';
          document.getElementById('hearts-container').appendChild(heart);
        }, i * 100);
      }
    }

    function noClicked() {
      document.getElementById("message").innerHTML =
        "❌ Mauvaise réponse, essaie encore 😌💫";
    }
  </script>

</body>
</html>
